<main class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    
    <!-- Encabezado del Balneario -->
    <div class="bg-gradient-to-r from-blue-600 to-cyan-600 p-6 text-white">
      <p class="text-xs uppercase tracking-wider font-semibold opacity-80">Solicitud reserva</p>
      <h1 class="text-3xl font-bold mt-1">
        {{ balneario()?.name }}
      </h1>
    </div>

    <!-- Contenedor Principal de Dos Columnas -->
    <div class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- COLUMNA IZQUIERDA: Selección de Filas con Detalles -->
      <div>
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Selecciona tu Fila</h2>
        <p class="text-sm text-gray-500 mb-4">Elige el sector donde deseas ubicarte.</p>
        
        @if (rows().length > 0) {
          <div class="space-y-3">
            @for (row of rows(); track row.id) {
              <button 
                type="button"
                (click)="selectRow(row.id)"
                [ngClass]="{
                  'border-blue-600 bg-blue-50/50 ring-2 ring-blue-600/20': rowSelectedId() === row.id,
                  'border-gray-200 bg-white hover:border-gray-300': rowSelectedId() !== row.id
                }"
                class="w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between gap-4">
                
                <!-- Número de Fila y Tag -->
                <div class="flex items-center gap-3">
                  <div 
                    [ngClass]="{
                      'bg-blue-600 text-white': rowSelectedId() === row.id,
                      'bg-gray-100 text-gray-700': rowSelectedId() !== row.id
                    }"
                    class="h-12 w-12 rounded-lg flex flex-col items-center justify-center font-bold transition-colors">
                    <span class="text-[10px] uppercase font-semibold tracking-tight opacity-80 leading-none mb-0.5">Fila</span>
                    <span class="text-lg leading-none">{{ row.number }}</span>
                  </div>
                  <div>
                    <span class="text-xs font-semibold uppercase px-2 py-0.5 bg-gray-100 rounded text-gray-600 border border-gray-200">
                      {{ row.tag }}
                    </span>
                  </div>
                </div>

                <!-- Rango de Carpas -->
                <div class="text-right">
                  <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Carpas libres</p>
                  <p class="text-sm font-semibold text-gray-700 mt-0.5">
                    N° {{ row.firstBeachTent }} al {{ row.lastBeachTent }}
                  </p>
                </div>

              </button>
            }
          </div>
        } @else {
          <div class="text-center py-8 border-2 border-dashed border-gray-200 rounded-xl">
            <p class="text-gray-400 text-sm">No hay sectores disponibles actualmente</p>
          </div>
        }
      </div>

      <!-- COLUMNA DERECHA: Formulario -->
      <div>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
          
          <!-- Fielset: Fecha de Inicio -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Fecha de inicio</label>
            <input 
              type="date" 
              formControlName="startDate"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none text-sm text-gray-700">
          </div>

          <!-- Fielset: Fecha de Fin -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Fecha de fin</label>
            <input 
              type="date" 
              formControlName="endDate"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none text-sm text-gray-700">
          </div>

          <!-- Fielset: Nota -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Nota</label>
            <textarea 
              formControlName="note" 
              rows="3"
              placeholder="Ingresa preferencia"
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none text-sm text-gray-700 resize-none"></textarea>
          </div>

          <!-- Botón de Envío -->
          <button 
            type="submit" 
            [disabled]="form.invalid || !rowSelectedId()"
            class="w-full mt-4 py-3 px-4 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-semibold rounded-xl shadow-md hover:from-blue-700 hover:to-cyan-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-40 disabled:cursor-not-allowed transition-all transform active:scale-[0.98]">
            Confirmar Reserva
          </button>
          
        </form>
      </div>

    </div>
  </div>
</main>
