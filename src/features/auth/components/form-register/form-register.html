<!-- Formulario de Registro -->
<form [formGroup]="form" (ngSubmit)="register()" class="flex flex-col gap-5">

    <!-- FILA 1: Nombre y Apellido en 2 Columnas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

        <!-- Nombre -->
        <div class="flex flex-col gap-2">
            <label for="firstName" class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
                Nombre <span class="text-rose-500">*</span>
            </label>
            <input id="firstName" type="text" placeholder="Introduce tu nombre" formControlName="firstName"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm font-semibold placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition-all duration-200" />
        </div>

        <!-- Apellido -->
        <div class="flex flex-col gap-2">
            <label for="lastName" class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
                Apellido <span class="text-rose-500">*</span>
            </label>
            <input id="lastName" type="text" placeholder="Introduce tu apellido" formControlName="lastName"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm font-semibold placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition-all duration-200" />
        </div>

    </div>

    <!-- FILA 2: Email -->
    <div class="flex flex-col gap-2">
        <label for="email" class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
            Correo Electrónico <span class="text-rose-500">*</span>
        </label>
        <input id="email" type="email" placeholder="nombre123@gmail.com" formControlName="email"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm font-semibold placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition-all duration-200" />
    </div>

    <!-- FILA 3: Contraseña -->
    <div class="flex flex-col gap-2">
        <label for="password" class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
            Contraseña <span class="text-rose-500">*</span>
        </label>
        <input id="password" type="password" placeholder="Introduce una contraseña segura" formControlName="password"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm font-semibold placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition-all duration-200" />
    </div>

    <!-- FILA 4: Confirmar Contraseña -->
    <div class="flex flex-col gap-2">
        <label for="confirmPassword" class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
            Repetir Contraseña <span class="text-rose-500">*</span>
        </label>
        <input id="confirmPassword" type="password" placeholder="Vuelve a introducir tu contraseña"
            formControlName="confirmPassword"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm font-semibold placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 transition-all duration-200" />


        @if (passwordsDoNotMatch) {
        <p class="text-[11px] font-bold text-rose-500 flex items-center gap-1 mt-0.5 animate-fade-in">
            <span>Las contraseñas no coinciden.</span>
        </p>
        }
    </div>

    <!-- Botón Submit -->
    <div class="mt-4">
        <button type="submit" [disabled]="form.invalid"
            class="w-full bg-slate-900 hover:bg-sky-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-black text-xs px-8 py-4 rounded-xl shadow-md transition-all duration-200 active:scale-95">
            Crear Cuenta
        </button>
    </div>

</form>

<!-- Footer / Iniciar Sesión -->
<p class="text-center text-xs text-slate-500 font-semibold mt-6">
    ¿Ya tenés una cuenta?
    <a routerLink="/login" class="text-sky-600 hover:underline font-bold">Iniciá sesión acá</a>
</p>
