<article class="p-5 bg-white border border-slate-200/80 rounded-2xl shadow-sm hover:shadow-md hover:border-sky-300 transition-all duration-200 flex flex-col gap-3">
  
  <!-- Encabezado con Avatar, Email visible y Fecha -->
  <header class="flex items-center justify-between gap-3 border-b border-slate-100 pb-3">
    
    <div class="flex items-center gap-3 min-w-0">

      <!-- Email del usuario -->
      <div class="flex flex-col min-w-0">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Usuario</span>
        <h4 class="font-bold text-slate-800 text-sm truncate" [title]="comment?.userEmail">
          {{ comment?.userEmail }}
        </h4>
      </div>
    </div>

    <!-- Fecha de creación -->
    <time [dateTime]="comment?.created_at" class="text-[11px] font-bold text-sky-700 bg-sky-50 px-2.5 py-1 rounded-lg border border-sky-100 shrink-0">
      {{ comment?.created_at | date:'dd/MM/yyyy' }}
    </time>

  </header>

  <!-- Cuerpo del comentario -->
  <p class="text-xs sm:text-sm font-medium text-slate-600 leading-relaxed px-1 whitespace-pre-line">
    {{ comment?.text }}
  </p>

</article>
